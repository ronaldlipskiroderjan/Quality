spring:
  application:
    name: Quality

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  expiration: ${JWT_EXPIRATION:900000}
  key: ${JWT_KEY}

app:
  admin:
    nome: ${ADMIN_NOME}
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}