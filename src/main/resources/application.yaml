spring:
  application:
    name: Quality

  mvc:
    problemdetails:
      enabled: true

  data:
    web:
      pageable:
        default-page-size: 15
        max-page-size: 100

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  expiration: ${JWT_EXPIRATION:900000}
  key: ${JWT_KEY}

app:
  cors:
    origens-permitidas: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  admin:
    nome: ${ADMIN_NOME}
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  agendamento:
    prazos:
      intervalo-ms: ${PRAZO_SCHEDULER_INTERVALO_MS:60000}
      atraso-inicial-ms: ${PRAZO_SCHEDULER_ATRASO_INICIAL_MS:30000}
      tamanho-lote: ${PRAZO_SCHEDULER_TAMANHO_LOTE:100}
